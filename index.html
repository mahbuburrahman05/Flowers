<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Flower Garden</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
}

body {

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}


/* =====================================================
   MAIN SCENE
===================================================== */

.scene {

    position: relative;

    width: 100vw;
    height: 100vh;

    min-height: 100svh;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center bottom,
            #111812 0%,
            #050705 38%,
            #000000 75%
        );
}


/* =====================================================
   CANVAS
===================================================== */

#garden {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    z-index: 1;
}


/* =====================================================
   DARK VIGNETTE
===================================================== */

.vignette {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 3;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.25) 65%,
            rgba(0,0,0,.72) 100%
        );
}


/* =====================================================
   ROMANTIC TEXT
===================================================== */

.message {

    position: absolute;

    z-index: 10;

    left: 50%;
    top: 46%;

    width: min(600px, 90%);

    transform:
        translate(-50%, -50%)
        translateY(30px);

    text-align: center;

    color: white;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 2s ease,
        transform 2s cubic-bezier(.2,.8,.2,1);

    text-shadow:
        0 2px 20px rgba(0,0,0,.95),
        0 0 35px rgba(255,255,255,.08);
}


.message.show {

    opacity: 1;

    transform:
        translate(-50%, -50%)
        translateY(0);
}


/* =====================================================
   SMALL HEADING
===================================================== */

.message .small {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 11px;

    letter-spacing: 7px;

    font-weight: 400;

    color:
        rgba(255,255,255,.75);

    margin-bottom: 16px;

    text-transform: uppercase;
}


/* =====================================================
   MAIN HEADING
===================================================== */

.message h1 {

    font-size:
        clamp(42px, 6vw, 76px);

    line-height: 1;

    font-weight: 400;

    margin: 0;

    color: #fff;
}


/* =====================================================
   PARAGRAPH
===================================================== */

.message p {

    margin-top: 22px;

    font-size:
        clamp(15px, 2vw, 19px);

    line-height: 1.8;

    color:
        rgba(255,255,255,.85);
}


/* =====================================================
   HEART
===================================================== */

.message .heart {

    display: block;

    margin-top: 18px;

    font-size: 22px;

    color: #f7b8c9;

    animation:
        heartbeat 2s ease-in-out infinite;
}


@keyframes heartbeat {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.18);
    }
}


/* =====================================================
   TABLET
===================================================== */

@media (max-width: 900px) {

    .message {

        width: 88%;

        top: 45%;
    }

    .message h1 {

        font-size: 58px;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .scene {

        width: 100vw;

        height: 100svh;

        min-height: 100svh;
    }


    .message {

        top: 42%;

        width: 88%;

        padding: 0 5px;
    }


    .message .small {

        font-size: 8px;

        letter-spacing: 4px;

        margin-bottom: 13px;
    }


    .message h1 {

        font-size: clamp(
            38px,
            12vw,
            48px
        );
    }


    .message p {

        margin-top: 17px;

        font-size: 14px;

        line-height: 1.7;
    }


    .message .heart {

        margin-top: 14px;

        font-size: 20px;
    }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media (max-width: 380px) {

    .message {

        top: 40%;
    }


    .message .small {

        font-size: 7px;

        letter-spacing: 3px;
    }


    .message h1 {

        font-size: 36px;
    }


    .message p {

        font-size: 13px;
    }

}

</style>

</head>


<body>


<div class="scene">

    <canvas id="garden"></canvas>

    <div class="vignette"></div>


    <!-- =================================================
         ROMANTIC MESSAGE
    ================================================= -->

    <div
        class="message"
        id="message"
    >

        <div class="small">

            FOR YOU, FARIHA

        </div>


        <h1>

            My Love

        </h1>


        <p>

            Every flower that blooms<br>
            reminds me of you.

        </p>


        <span class="heart">

            ♡

        </span>

    </div>

</div>



<script>

/* =========================================================
   CANVAS SETUP
========================================================= */

const canvas =
    document.getElementById("garden");

const ctx =
    canvas.getContext("2d");

let W = 0;

let H = 0;

let DPR = 1;


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;


    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;


    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";


    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   HELPERS
========================================================= */

function random(min, max) {

    return Math.random() *
        (max - min) +
        min;
}


function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );
}


function easeOutCubic(t) {

    return 1 -
        Math.pow(
            1 - t,
            3
        );
}


function easeOutBack(t) {

    const c1 =
        1.70158;

    const c3 =
        c1 + 1;

    return 1 +
        c3 *
        Math.pow(
            t - 1,
            3
        ) +
        c1 *
        Math.pow(
            t - 1,
            2
        );
}


/* =========================================================
   FLOWER TYPES
========================================================= */

const FLOWER_TYPES = [

    "rose",

    "sunflower",

    "tulip",

    "daisy",

    "blossom"

];


const FLOWER_COLORS = {

    rose: [

        ["#b51f45", "#f05b7d"],

        ["#8f1838", "#d94468"],

        ["#c72d55", "#ff7d99"]

    ],


    sunflower: [

        ["#e5a400", "#ffd84d"],

        ["#d58d00", "#ffc928"]

    ],


    tulip: [

        ["#d83258", "#ff718f"],

        ["#b51e43", "#ed5475"],

        ["#f09b32", "#ffd05b"],

        ["#e55a8a", "#ff9fbe"]

    ],


    daisy: [

        ["#ffffff", "#e8e8e8"],

        ["#fffaf0", "#ffffff"]

    ],


    blossom: [

        ["#e978a1", "#ffc2d6"],

        ["#f49ab7", "#ffe0ea"],

        ["#ffffff", "#ffd5e2"]

    ]

};


/* =========================================================
   FLOWERS ARRAY
========================================================= */

const flowers = [];


/* =========================================================
   CREATE FLOWER
========================================================= */

function createFlower(index) {

    /*
       Responsive horizontal position
    */

    const x =
        random(
            W * -0.03,
            W * 1.03
        );


    /*
       Responsive height
    */

    const height =
        W <= 600

        ? random(
            H * 0.18,
            H * 0.48
        )

        : random(
            H * 0.22,
            H * 0.60
        );


    /*
       Depth
    */

    const depth =
        Math.random();


    const scale =
        0.55 +
        depth * 0.55;


    const baseY =
        H + 20;


    const stemHeight =
        height * scale;


    const flowerY =
        baseY -
        stemHeight;


    /* =====================================================
       FLOWER TYPE

       Sunflower = 40%
       Other flowers = 60%
    ===================================================== */

    let type;


    if (
        Math.random() < 0.40
    ) {

        type =
            "sunflower";

    }

    else {

        const otherTypes = [

            "rose",

            "tulip",

            "daisy",

            "blossom"

        ];


        type =
            otherTypes[
                Math.floor(
                    Math.random() *
                    otherTypes.length
                )
            ];

    }


    /*
       Colors
    */

    const typeColors =
        FLOWER_COLORS[type];


    const selectedColors =
        typeColors[
            Math.floor(
                Math.random() *
                typeColors.length
            )
        ];


    const petalCount =
        Math.random() > .75
        ? 7
        : 6;


    /*
       Growth delay
    */

    const delay =
        index * 0.14 +
        random(
            0,
            .35
        );


    flowers.push({

        x,

        baseY,

        stemHeight,

        flowerY,

        scale,

        type,

        color1:
            selectedColors[0],

        color2:
            selectedColors[1],

        petalCount,

        /*
           Smaller flowers on mobile
        */

        size:

            W <= 600

            ? random(
                10,
                19
            ) * scale

            : random(
                13,
                24
            ) * scale,

        delay,

        growDuration:
            random(
                1.7,
                2.8
            ),

        bloomDuration:
            random(
                .7,
                1.1
            ),

        sway:
            random(
                5,
                14
            ),

        swaySpeed:
            random(
                .001,
                .0025
            ),

        phase:
            random(
                0,
                Math.PI * 2
            ),

        leafSide:

            Math.random() > .5
            ? 1
            : -1,

        bloom: 0,

        growth: 0

    });

}


/* =========================================================
   GENERATE GARDEN

   DESKTOP = 40
   MOBILE  = 18
========================================================= */

function generateGarden() {

    flowers.length = 0;


    const count =
        W <= 600

        ? 18

        : 40;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        createFlower(i);

    }


    /*
       Background flowers first
    */

    flowers.sort(
        (a, b) =>
            a.scale - b.scale
    );

}


generateGarden();


/* =========================================================
   DRAW STEM
========================================================= */

function drawStem(
    flower,
    growth,
    time
) {

    if (growth <= 0)
        return;


    const x =
        flower.x;


    const baseY =
        flower.baseY;


    const currentHeight =
        flower.stemHeight *
        growth;


    const wind =
        Math.sin(
            time *
            flower.swaySpeed +
            flower.phase
        ) *
        flower.sway *
        growth;


    const topX =
        x + wind;


    const topY =
        baseY -
        currentHeight;


    const gradient =
        ctx.createLinearGradient(
            x,
            baseY,
            topX,
            topY
        );


    gradient.addColorStop(
        0,
        "#0b3517"
    );


    gradient.addColorStop(
        .5,
        "#286936"
    );


    gradient.addColorStop(
        1,
        "#4d914e"
    );


    ctx.beginPath();


    ctx.moveTo(
        x,
        baseY
    );


    ctx.bezierCurveTo(

        x - wind * .25,

        baseY -
        currentHeight *
        .30,

        topX +
        wind * .20,

        baseY -
        currentHeight *
        .70,

        topX,

        topY

    );


    ctx.strokeStyle =
        gradient;


    ctx.lineWidth =
        2.2 *
        flower.scale;


    ctx.lineCap =
        "round";


    ctx.stroke();


    drawLeaves(
        flower,
        growth,
        topX,
        topY,
        wind
    );


    return {

        x: topX,

        y: topY

    };

}


/* =========================================================
   DRAW LEAVES
========================================================= */

function drawLeaves(
    flower,
    growth,
    topX,
    topY,
    wind
) {

    if (growth < .35)
        return;


    const positions = [

        {
            p: .30,
            side: -1
        },

        {
            p: .52,
            side: 1
        },

        {
            p: .70,
            side: -1
        }

    ];


    positions.forEach(
        leaf => {

            if (
                growth <
                leaf.p
            )
                return;


            const y =
                flower.baseY -
                flower.stemHeight *
                leaf.p;


            const x =
                flower.x +
                wind *
                leaf.p;


            const size =
                15 *
                flower.scale;


            drawLeaf(
                x,
                y,
                size,
                leaf.side
            );

        }
    );

}


/* =========================================================
   DRAW ONE LEAF
========================================================= */

function drawLeaf(
    x,
    y,
    size,
    side
) {

    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.rotate(
        side *
        -.55
    );


    ctx.beginPath();


    ctx.moveTo(
        0,
        0
    );


    ctx.bezierCurveTo(

        size * .45,
        -size * .65,

        size * 1.1,
        -size * .45,

        size,
        0

    );


    ctx.bezierCurveTo(

        size * .65,
        size * .20,

        size * .25,
        size * .18,

        0,
        0

    );


    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            size,
            0
        );


    gradient.addColorStop(
        0,
        "#163e1d"
    );


    gradient.addColorStop(
        1,
        "#397d3e"
    );


    ctx.fillStyle =
        gradient;


    ctx.fill();


    ctx.restore();

}


/* =========================================================
   DRAW FLOWER
========================================================= */

function drawFlower(
    flower,
    x,
    y,
    bloom
) {

    if (bloom <= 0)
        return;


    const size =
        flower.size;


    const scale =
        easeOutBack(
            clamp(
                bloom,
                0,
                1
            )
        );


    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.scale(
        scale,
        scale
    );


    const wind =
        Math.sin(
            performance.now() *
            flower.swaySpeed +
            flower.phase
        ) *
        0.035;


    ctx.rotate(
        wind
    );


    if (
        flower.type ===
        "rose"
    ) {

        drawRose(
            size,
            flower.color1,
            flower.color2
        );

    }

    else if (
        flower.type ===
        "sunflower"
    ) {

        drawSunflower(
            size
        );

    }

    else if (
        flower.type ===
        "tulip"
    ) {

        drawTulip(
            size,
            flower.color1,
            flower.color2
        );

    }

    else if (
        flower.type ===
        "daisy"
    ) {

        drawDaisy(
            size,
            flower.color1,
            flower.color2
        );

    }

    else {

        drawBlossom(
            size,
            flower.color1,
            flower.color2
        );

    }


    ctx.restore();

}


/* =========================================================
   ROSE
========================================================= */

function drawRose(
    size,
    color1,
    color2
) {

    ctx.save();


    ctx.shadowBlur = 8;

    ctx.shadowColor =
        color1;


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const angle =
            (
                Math.PI * 2 /
                10
            ) * i;


        ctx.save();


        ctx.rotate(
            angle
        );


        const gradient =
            ctx.createRadialGradient(

                0,
                -size * .55,
                1,

                0,
                -size * .55,
                size

            );


        gradient.addColorStop(
            0,
            color2
        );


        gradient.addColorStop(
            1,
            color1
        );


        ctx.beginPath();


        ctx.moveTo(
            0,
            0
        );


        ctx.bezierCurveTo(

            -size * .65,
            -size * .35,

            -size * .45,
            -size * 1.05,

            0,
            -size * 1.35

        );


        ctx.bezierCurveTo(

            size * .45,
            -size * 1.05,

            size * .65,
            -size * .35,

            0,
            0

        );


        ctx.fillStyle =
            gradient;


        ctx.fill();


        ctx.restore();

    }


    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const angle =
            (
                Math.PI * 2 /
                7
            ) * i;


        ctx.save();


        ctx.rotate(
            angle
        );


        ctx.beginPath();


        ctx.arc(

            0,

            -size * .28,

            size * .45,

            .3,

            Math.PI * 1.8

        );


        ctx.strokeStyle =
            color1;


        ctx.lineWidth =
            size * .15;


        ctx.stroke();


        ctx.restore();

    }


    ctx.beginPath();


    ctx.arc(

        0,
        0,

        size * .25,

        0,
        Math.PI * 2

    );


    ctx.fillStyle =
        color1;


    ctx.fill();


    ctx.restore();

}


/* =========================================================
   SUNFLOWER
========================================================= */

function drawSunflower(
    size
) {

    const petalOuter =
        "#e8a900";


    const petalInner =
        "#ffd43b";


    ctx.save();


    ctx.shadowBlur = 6;

    ctx.shadowColor =
        "#ffd84d";


    const petals = 18;


    for (
        let i = 0;
        i < petals;
        i++
    ) {

        const angle =
            Math.PI * 2 *
            i /
            petals;


        ctx.save();


        ctx.rotate(
            angle
        );


        const gradient =
            ctx.createLinearGradient(

                0,
                -size,

                0,
                -size * 1.8

            );


        gradient.addColorStop(
            0,
            petalInner
        );


        gradient.addColorStop(
            1,
            petalOuter
        );


        ctx.beginPath();


        ctx.ellipse(

            0,

            -size * .9,

            size * .25,

            size * .8,

            0,

            0,

            Math.PI * 2

        );


        ctx.fillStyle =
            gradient;


        ctx.fill();


        ctx.restore();

    }


    ctx.shadowBlur = 3;

    ctx.shadowColor =
        "#6c4100";


    ctx.beginPath();


    ctx.arc(

        0,
        0,

        size * .55,

        0,
        Math.PI * 2

    );


    const centerGradient =
        ctx.createRadialGradient(

            0,
            0,
            1,

            0,
            0,
            size * .55

        );


    centerGradient.addColorStop(
        0,
        "#4c2b00"
    );


    centerGradient.addColorStop(
        .6,
        "#704300"
    );


    centerGradient.addColorStop(
        1,
        "#9a6100"
    );


    ctx.fillStyle =
        centerGradient;


    ctx.fill();


    ctx.shadowBlur = 0;


    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const angle =
            i * 2.399;


        const radius =
            size *
            .42 *
            Math.sqrt(
                i / 30
            );


        ctx.beginPath();


        ctx.arc(

            Math.cos(angle) *
            radius,

            Math.sin(angle) *
            radius,

            size * .035,

            0,

            Math.PI * 2

        );


        ctx.fillStyle =
            "#c58a1d";


        ctx.fill();

    }


    ctx.restore();

}


/* =========================================================
   TULIP
========================================================= */

function drawTulip(
    size,
    color1,
    color2
) {

    ctx.save();


    ctx.shadowBlur = 7;

    ctx.shadowColor =
        color1;


    ctx.beginPath();


    ctx.moveTo(
        -size * .85,
        -size * .2
    );


    ctx.bezierCurveTo(

        -size * 1.0,
        -size * 1.1,

        -size * .45,
        -size * 1.3,

        0,
        -size * .75

    );


    ctx.bezierCurveTo(

        size * .45,
        -size * 1.3,

        size * 1.0,
        -size * 1.1,

        size * .85,
        -size * .2

    );


    ctx.bezierCurveTo(

        size * .7,
        size * .25,

        size * .3,
        size * .4,

        0,
        size * .2

    );


    ctx.bezierCurveTo(

        -size * .3,
        size * .4,

        -size * .7,
        size * .25,

        -size * .85,
        -size * .2

    );


    const gradient =
        ctx.createLinearGradient(

            0,
            -size,

            0,
            size

        );


    gradient.addColorStop(
        0,
        color2
    );


    gradient.addColorStop(
        1,
        color1
    );


    ctx.fillStyle =
        gradient;


    ctx.fill();


    ctx.beginPath();


    ctx.moveTo(
        0,
        -size * .8
    );


    ctx.quadraticCurveTo(

        -size * .1,
        -size * .2,

        0,
        size * .15

    );


    ctx.strokeStyle =
        "rgba(120,20,40,.3)";


    ctx.lineWidth =
        size * .07;


    ctx.stroke();


    ctx.restore();

}


/* =========================================================
   DAISY
========================================================= */

function drawDaisy(
    size,
    color1,
    color2
) {

    ctx.save();


    ctx.shadowBlur = 5;

    ctx.shadowColor =
        "#ffffff";


    const petals = 14;


    for (
        let i = 0;
        i < petals;
        i++
    ) {

        const angle =
            Math.PI * 2 *
            i /
            petals;


        ctx.save();


        ctx.rotate(
            angle
        );


        ctx.beginPath();


        ctx.ellipse(

            0,

            -size * .8,

            size * .25,

            size * .75,

            0,

            0,

            Math.PI * 2

        );


        const gradient =
            ctx.createLinearGradient(

                0,
                -size * .2,

                0,
                -size * 1.5

            );


        gradient.addColorStop(
            0,
            color1
        );


        gradient.addColorStop(
            1,
            color2
        );


        ctx.fillStyle =
            gradient;


        ctx.fill();


        ctx.restore();

    }


    ctx.shadowBlur = 4;

    ctx.shadowColor =
        "#ffdb55";


    ctx.beginPath();


    ctx.arc(

        0,
        0,

        size * .32,

        0,
        Math.PI * 2

    );


    ctx.fillStyle =
        "#f3c328";


    ctx.fill();


    ctx.restore();

}


/* =========================================================
   BLOSSOM
========================================================= */

function drawBlossom(
    size,
    color1,
    color2
) {

    ctx.save();


    ctx.shadowBlur = 7;

    ctx.shadowColor =
        color1;


    const petals = 5;


    for (
        let i = 0;
        i < petals;
        i++
    ) {

        const angle =
            Math.PI * 2 *
            i /
            petals;


        ctx.save();


        ctx.rotate(
            angle
        );


        ctx.beginPath();


        ctx.moveTo(
            0,
            0
        );


        ctx.bezierCurveTo(

            -size * .5,
            -size * .5,

            -size * .4,
            -size * 1.05,

            0,
            -size * 1.25

        );


        ctx.bezierCurveTo(

            size * .4,
            -size * 1.05,

            size * .5,
            -size * .5,

            0,
            0

        );


        const gradient =
            ctx.createRadialGradient(

                0,
                -size * .7,
                1,

                0,
                -size * .7,
                size

            );


        gradient.addColorStop(
            0,
            color2
        );


        gradient.addColorStop(
            1,
            color1
        );


        ctx.fillStyle =
            gradient;


        ctx.fill();


        ctx.restore();

    }


    ctx.shadowBlur = 3;


    ctx.beginPath();


    ctx.arc(

        0,
        0,

        size * .16,

        0,
        Math.PI * 2

    );


    ctx.fillStyle =
        "#e5a93a";


    ctx.fill();


    ctx.restore();

}


/* =========================================================
   GRASS
========================================================= */

function drawGrass() {

    const ground =
        H - 15;


    const amount =
        Math.floor(
            W / 8
        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const x =
            i * 8 +
            random(
                -4,
                4
            );


        const height =
            random(
                8,
                28
            );


        const sway =
            Math.sin(

                performance.now() *
                .001 +
                i

            ) * 3;


        ctx.beginPath();


        ctx.moveTo(
            x,
            ground
        );


        ctx.quadraticCurveTo(

            x + sway,

            ground -
            height * .5,

            x + sway * 2,

            ground -
            height

        );


        ctx.strokeStyle =
            "rgba(38,88,42,.55)";


        ctx.lineWidth = 1;


        ctx.stroke();

    }

}


/* =========================================================
   ANIMATION
========================================================= */

const startTime =
    performance.now();


const TOTAL_GROW_TIME =
    6.5;


/* =========================================================
   MESSAGE
========================================================= */

const message =
    document.getElementById(
        "message"
    );


let messageShown =
    false;


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(time) {

    const elapsed =
        (
            time -
            startTime
        ) / 1000;


    /*
       Clear screen
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
       Ground darkness
    */

    const groundGradient =
        ctx.createLinearGradient(

            0,
            H * .70,

            0,
            H

        );


    groundGradient.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );


    groundGradient.addColorStop(
        .65,
        "rgba(3,12,5,.45)"
    );


    groundGradient.addColorStop(
        1,
        "rgba(2,10,4,.95)"
    );


    ctx.fillStyle =
        groundGradient;


    ctx.fillRect(

        0,

        H * .65,

        W,

        H * .35

    );


    /*
       Grass
    */

    drawGrass();


    /*
       Flowers
    */

    flowers.forEach(
        flower => {

            const local =
                elapsed -
                flower.delay;


            if (
                local <= 0
            )
                return;


            /*
               Stem growth
            */

            const growthProgress =
                clamp(

                    local /
                    flower.growDuration,

                    0,
                    1

                );


            const growth =
                easeOutCubic(
                    growthProgress
                );


            const stem =
                drawStem(

                    flower,

                    growth,

                    time

                );


            if (!stem)
                return;


            /*
               Bloom
            */

            const bloomStart =
                flower.growDuration -
                .18;


            const bloomProgress =
                clamp(

                    (
                        local -
                        bloomStart
                    ) /
                    flower.bloomDuration,

                    0,
                    1

                );


            if (
                bloomProgress > 0
            ) {

                drawFlower(

                    flower,

                    stem.x,

                    stem.y,

                    bloomProgress

                );

            }

        }
    );


    /*
       Show message
    */

    if (

        elapsed >
        TOTAL_GROW_TIME &&

        !messageShown

    ) {

        messageShown = true;

        message.classList.add(
            "show"
        );

    }


    requestAnimationFrame(
        animate
    );

}


requestAnimationFrame(
    animate
);


/* =========================================================
   RESTART WITH R
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        if (

            event.key === "r" ||
            event.key === "R"

        ) {

            location.reload();

        }

    }
);

</script>
